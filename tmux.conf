# Remap prefix key from ctrl+b -> ctrl+a
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Intuitive splits using | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind '%'

# New window with prefix + t
# You can still do this with prefix + c as well
bind t new-window

# Intuitive pane switching with meta + ijkl (right hand wasd arrows)
# 
# -n means no prefix is required
bind -n M-j select-pane -L
bind -n M-l select-pane -R
bind -n M-i select-pane -U
bind -n M-k select-pane -D

# Intuitive pane resizing with meta + ctrl + ijkl (right hand wasd arrows)
#
# -r means that the command will repeat if the key is held
bind -rn M-C-j resize-pane -L 4
bind -rn M-C-l resize-pane -R 4
bind -rn M-C-i resize-pane -U 4
bind -rn M-C-k resize-pane -D 4

# Faster unprefixed window switching
bind -n M-0 select-window -t 0
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Reload with prefix + r and show a message
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Clear the current window's agent-complete notification with prefix + o.
# This works even while Claude Code or Pi owns the foreground terminal.
bind o run-shell 'tmux set-window-option -u -t "#{pane_id}" @cc \; display-message "Agent notification cleared"'

# Toggle window pane titles on / off
bind T if -F '#{==:#{pane-border-status},off}' \
  'set -g pane-border-status top' \
  'set -g pane-border-status off'

# Mouse mode!
set -g mouse on

# Extended keys!
# 
# This allows tmux to pass through key sequences like ctrl+shift+key & ctrl+enter
# Which are generally useful for rich cli & tui programs
#
# However, setting this also seems to break helpful mouse utilities like selecting to copy
# inside of tools like less, etc.
set -s extended-keys on
# set -s extended-keys-format "standard"
set -g extended-keys-format csi-u

# Don't rename windows automatically
# Manual renames can be done with ','
set-option -g allow-rename off

# Renumber windows automatically when windows are closed
set -g renumber-windows on

# don't do anything when a 'bell' rings
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# Window pane title settings
set -g pane-border-format " #{?pane_active,#[bold],}#{pane_title} "
set -g allow-set-title on

# Copy mode styling
# 
# You can use this to change the way that tmux looks when you highlight text
# But I kinda like the default yellow highlighter look
# setw -g mode-style 'fg=black bg=red bold'


# Border styling
#
# You can use this to change the way borders look
# But I like the default nord green and white colors
# set -g pane-border-style 'fg=red'
# set -g pane-active-border-style 'fg=yellow'


# Status bar styling
#
# Not changing much here because I kinda like the defaults
set -g status-position bottom
set -g status-justify left
# set -g status-style 'fg=red'

set -g status-left ' '
set -g status-left-length 10

# set -g status-right-style 'fg=black bg=yellow'
set -g status-right ' #{claude_usage}  |  %Y-%m-%d %I:%M %p '
set -g status-right-length 60

# In the status bar, highlight the currently selected window
# 
# Lowlight the other windows to add visual clarity
setw -g window-status-style fg=black,bg=green,bold
setw -g window-status-format         '  [#I] #W #(~/.tmux/glyph "#{@cc}" "#{@busy}" "#{@cc_active}") #{?window_zoomed_flag,⛶}  '
setw -g window-status-current-style fg=green,bg=black,bold
setw -g window-status-current-format '  [#I] #W #(~/.tmux/glyph "#{@cc}" "#{@busy}" "#{@cc_active}") #{?window_zoomed_flag,⛶}  '

# Message styling
set -g message-style 'bold'

# Redraw the status bar every second (default every 15 seconds)
set -g status-interval 1


# tmux-fzf
# Launch tmux-fzf with a bare Ctrl-f (no prefix). -n means no prefix required.
# Note: this shadows readline's forward-char inside tmux's key table.
unbind C-f
bind -n C-f run-shell -b ~/.tmux/plugins/tmux-fzf/main.sh

# tmux-claude-usage
set -g @claude_usage_show_reset 'off'

###################
## P L U G I N S ##
###################
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'docker-run/tmux-claude-usage'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

